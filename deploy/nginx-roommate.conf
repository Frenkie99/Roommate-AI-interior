server {
    listen 80;
    server_name roommate-ai.cn www.roommate-ai.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name roommate-ai.cn www.roommate-ai.cn;

    ssl_certificate /etc/nginx/cert/roommate-ai.pem;
    ssl_certificate_key /etc/nginx/cert/roommate-ai.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 50M;

    charset utf-8;

    # 静态资源目录（logo、gallery 等图片，构建产物在 dist/assets 下）
    location /assets/logo/ {
        alias /var/www/roommate/frontend/dist/assets/logo/;
        expires 30d;
    }

    location /assets/gallery/ {
        alias /var/www/roommate/frontend/dist/assets/gallery/;
        expires 30d;
    }

    location /assets/video/ {
        alias /var/www/roommate/frontend/dist/assets/video/;
        expires 30d;
    }

    # 注意：steps 步骤图只存在于源目录 frontend/assets/，dist 里没有，故指向源目录
    location /assets/steps/ {
        alias /var/www/roommate/frontend/assets/steps/;
        expires 30d;
    }

    location "/assets/hero section/" {
        alias "/var/www/roommate/frontend/dist/assets/hero section/";
        expires 30d;
    }

    # 前端构建产物
    location / {
        root /var/www/roommate/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|docs|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /output/ {
        alias /var/www/roommate/output/;
        expires 30d;
    }
}
