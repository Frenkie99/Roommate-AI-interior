name: Repair production APIYI key

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          ssh-keyscan -p "${ALIYUN_PORT:-22}" -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Replace key and restart backend
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_APP_DIR: ${{ secrets.ALIYUN_APP_DIR }}
          ALIYUN_BACKEND_SERVICE: ${{ secrets.ALIYUN_BACKEND_SERVICE }}
          PROD_APIYI_KEY: ${{ secrets.ROOMMATE_PROD_APIYI_KEY }}
        run: |
          set -Eeuo pipefail
          user="${ALIYUN_USER:-admin}"
          port="${ALIYUN_PORT:-22}"
          app_dir="${ALIYUN_APP_DIR:-/var/www/roommate}"
          service="${ALIYUN_BACKEND_SERVICE:-roommate-backend.service}"
          test -n "$PROD_APIYI_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$PROD_APIYI_KEY" > "$key_file"
          scp -i ~/.ssh/aliyun_deploy_key \
            -P "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$key_file" "$user@$ALIYUN_HOST:/tmp/roommate-apiyi-key"
          ssh -i ~/.ssh/aliyun_deploy_key \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$user@$ALIYUN_HOST" \
            "APP_DIR='$app_dir' SERVICE='$service' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR/backend"
          venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          key_path = Path("/tmp/roommate-apiyi-key")
          new_key = key_path.read_text(encoding="utf-8").strip()
          if not new_key:
              raise RuntimeError("replacement key is empty")

          original = env_path.read_text(encoding="utf-8")
          lines = original.splitlines()
          replaced = False
          updated = []
          for line in lines:
              if line.strip().startswith("APIYI_KEY="):
                  updated.append(f"APIYI_KEY={new_key}")
                  replaced = True
              else:
                  updated.append(line)
          if not replaced:
              updated.append(f"APIYI_KEY={new_key}")

          temp_path = env_path.with_suffix(".env.tmp")
          temp_path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          os.chmod(temp_path, 0o600)
          temp_path.replace(env_path)
          key_path.unlink(missing_ok=True)
          print("production_key_replaced=true")
          PY
          sudo -n systemctl restart "$SERVICE"
          for attempt in 1 2 3 4 5; do
            if curl -sf --connect-timeout 5 http://127.0.0.1:8000/health >/dev/null; then
              echo 'backend_healthy=true'
              exit 0
            fi
            sleep 2
          done
          echo 'backend_healthy=false'
          exit 1
          REMOTE
