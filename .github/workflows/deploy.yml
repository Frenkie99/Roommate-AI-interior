name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend (CI runner, not the 1GB server)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${ALIYUN_HOST:?Set ALIYUN_HOST in GitHub Secrets}"
          : "${ALIYUN_SSH_KEY:?Set ALIYUN_SSH_KEY in GitHub Secrets}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key

          port="${ALIYUN_PORT:-22}"
          ssh-keyscan -p "$port" -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend dist to server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          set -Eeuo pipefail
          user="${ALIYUN_USER:-admin}"
          port="${ALIYUN_PORT:-22}"

          tar -C frontend/dist -czf - . | \
            ssh -i ~/.ssh/aliyun_deploy_key \
              -p "$port" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "$user@$ALIYUN_HOST" \
              "cat > /tmp/frontend-dist.tar.gz"

          echo "Frontend dist uploaded to server"

      - name: Run server deployment
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_APP_DIR: ${{ secrets.ALIYUN_APP_DIR }}
          ALIYUN_BACKEND_SERVICE: ${{ secrets.ALIYUN_BACKEND_SERVICE }}
        run: |
          set -Eeuo pipefail

          user="${ALIYUN_USER:-admin}"
          port="${ALIYUN_PORT:-22}"
          app_dir="${ALIYUN_APP_DIR:-/var/www/roommate}"
          backend_service="${ALIYUN_BACKEND_SERVICE:-roommate-backend.service}"

          echo "=== Deploying ==="
          ssh -i ~/.ssh/aliyun_deploy_key \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "$user@$ALIYUN_HOST" \
            "APP_DIR='$app_dir' BRANCH='main' BACKEND_SERVICE='$backend_service' bash -s" \
            < scripts/server-deploy.sh

      - name: Verify deployment
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_APP_DIR: ${{ secrets.ALIYUN_APP_DIR }}
        run: |
          set -Eeuo pipefail
          user="${ALIYUN_USER:-admin}"
          port="${ALIYUN_PORT:-22}"
          app_dir="${ALIYUN_APP_DIR:-/var/www/roommate}"

          echo "=== Verifying deployment ==="

          # Check backend health
          backend_ok=false
          ssh -i ~/.ssh/aliyun_deploy_key \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$user@$ALIYUN_HOST" \
            "curl -sf --connect-timeout 5 http://127.0.0.1:8000/health" && backend_ok=true || true

          # Check homepage
          homepage_ok=false
          curl -sf --connect-timeout 10 "https://roommate-ai.cn" >/dev/null && homepage_ok=true || true

          # Check deployed commit
          deployed_commit="unknown"
          deployed_commit="$(ssh -i ~/.ssh/aliyun_deploy_key \
            -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$user@$ALIYUN_HOST" \
            "cat ${app_dir}/.deployed-commit 2>/dev/null || echo 'unknown'")" || true

          echo "Backend health: $backend_ok"
          echo "Homepage 200: $homepage_ok"
          echo "Deployed commit: $deployed_commit"

          if [ "$backend_ok" != "true" ]; then
            echo "::error::Backend health check failed"
            exit 1
          fi
          if [ "$homepage_ok" != "true" ]; then
            echo "::error::Homepage check failed"
            exit 1
          fi

          echo "=== Deployment verified ==="
