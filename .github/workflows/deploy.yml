name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend (in CI runner, not on the 1GB server)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${ALIYUN_HOST:?Set ALIYUN_HOST in GitHub Secrets}"
          : "${ALIYUN_SSH_KEY:?Set ALIYUN_SSH_KEY in GitHub Secrets}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key

          port="${ALIYUN_PORT:-22}"
          ssh-keyscan -p "$port" -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Run server deployment
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_APP_DIR: ${{ secrets.ALIYUN_APP_DIR }}
          ALIYUN_BACKEND_SERVICE: ${{ secrets.ALIYUN_BACKEND_SERVICE }}
        run: |
          set -Eeuo pipefail

          user="${ALIYUN_USER:-admin}"
          port="${ALIYUN_PORT:-22}"
          app_dir="${ALIYUN_APP_DIR:-/var/www/roommate}"
          backend_service="${ALIYUN_BACKEND_SERVICE:-roommate-backend.service}"

          ssh -i ~/.ssh/aliyun_deploy_key \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "$user@$ALIYUN_HOST" \
            "APP_DIR='$app_dir' BRANCH='main' BACKEND_SERVICE='$backend_service' SKIP_FRONTEND_BUILD=1 bash -s" \
            < scripts/server-deploy.sh

      - name: Upload built frontend to server
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          ALIYUN_APP_DIR: ${{ secrets.ALIYUN_APP_DIR }}
        run: |
          set -Eeuo pipefail
          user="${ALIYUN_USER:-admin}"
          port="${ALIYUN_PORT:-22}"
          app_dir="${ALIYUN_APP_DIR:-/var/www/roommate}"
          # 原子化替换 dist：先解压到 dist.new，再用 mv 瞬间切换，
          # 避免 "rm -rf dist 后、解压未完成" 的几秒内静态资源 404。
          tar -C frontend/dist -czf - . | ssh -i ~/.ssh/aliyun_deploy_key -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$user@$ALIYUN_HOST" "set -e; rm -rf '$app_dir/frontend/dist.new' '$app_dir/frontend/dist.old'; mkdir -p '$app_dir/frontend/dist.new'; tar -C '$app_dir/frontend/dist.new' -xzf -; [ -d '$app_dir/frontend/dist' ] && mv '$app_dir/frontend/dist' '$app_dir/frontend/dist.old'; mv '$app_dir/frontend/dist.new' '$app_dir/frontend/dist'; rm -rf '$app_dir/frontend/dist.old'"
